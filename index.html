<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandyLink | Find and Book Trusted Artisans</title>
  <style>
    :root {
      --bg: #f6f7fb;
      --card: #ffffff;
      --ink: #1f2937;
      --muted: #6b7280;
      --brand: #2563eb;
      --brand-soft: #dbeafe;
      --ok: #16a34a;
      --border: #e5e7eb;
      --client: #eff6ff;
      --artisan: #f3f4f6;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      color: var(--ink);
      background: linear-gradient(180deg, #eff6ff 0%, var(--bg) 300px);
    }

    .app {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .hero {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 28px rgba(17, 24, 39, 0.06);
      margin-bottom: 20px;
    }

    .hero h1 { margin: 0 0 6px; font-size: 1.9rem; }
    .hero p { margin: 0 0 14px; color: var(--muted); }

    .search-row {
      display: grid;
      grid-template-columns: 1fr 200px;
      gap: 10px;
    }

    input, select, button {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font: inherit;
    }

    input:focus, select:focus {
      outline: 2px solid var(--brand-soft);
      border-color: var(--brand);
    }

    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      min-height: 520px;
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--brand-soft);
      color: #1e40af;
      font-weight: 600;
    }

    .artisan-list {
      display: grid;
      gap: 10px;
      max-height: 450px;
      overflow: auto;
      padding-right: 4px;
    }

    .artisan {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .artisan h3 { margin: 0; font-size: 1rem; }
    .meta { color: var(--muted); font-size: 0.9rem; }
    .pill {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 9px;
      font-size: 0.75rem;
      background: #f9fafb;
      border: 1px solid var(--border);
      margin-right: 6px;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      cursor: pointer;
      background: var(--brand);
      color: white;
      border-color: var(--brand);
      font-weight: 600;
    }

    .btn.secondary {
      background: white;
      color: var(--ink);
    }

    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 10px;
      height: 100%;
    }

    .chat-feed {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      overflow: auto;
      min-height: 350px;
      background: #fcfcfd;
    }

    .msg {
      max-width: 90%;
      margin-bottom: 8px;
      padding: 9px 11px;
      border-radius: 10px;
      line-height: 1.35;
      font-size: 0.92rem;
    }

    .msg.client { background: var(--client); margin-left: auto; }
    .msg.artisan { background: var(--artisan); }

    .composer {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
    }

    .booking {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px;
      background: #fafafa;
    }

    .booking strong { color: var(--ok); }

    @media (max-width: 900px) {
      .grid { grid-template-columns: 1fr; }
      .panel { min-height: auto; }
      .chat-feed { min-height: 260px; }
    }

    @media (max-width: 560px) {
      .search-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="hero">
      <h1>HandyLink</h1>
      <p>Search nearby artisans, describe your issue in chat, and book in minutes.</p>
      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Search by skill, name, or issue (e.g., leaking tap)" />
        <select id="serviceFilter" aria-label="Service filter">
          <option value="all">All services</option>
          <option value="Plumber">Plumber</option>
          <option value="Electrician">Electrician</option>
          <option value="Carpenter">Carpenter</option>
          <option value="Painter">Painter</option>
          <option value="AC Technician">AC Technician</option>
        </select>
      </div>
    </section>

    <section class="grid">
      <article class="panel">
        <div class="section-head">
          <h2>Available artisans</h2>
          <span class="badge" id="resultCount">0 found</span>
        </div>
        <div id="artisanList" class="artisan-list"></div>
      </article>

      <article class="panel chat">
        <div class="section-head">
          <h2 id="chatTitle">Select an artisan to start</h2>
          <button id="bookNowBtn" class="btn" disabled>Book now</button>
        </div>

        <div id="bookingInfo" class="booking" hidden>
          <strong>Booking confirmed.</strong>
          <div id="bookingDetails"></div>
        </div>

        <div id="chatFeed" class="chat-feed" aria-live="polite">
          <div class="msg artisan">Hi! Pick an artisan from the left panel to discuss your issue.</div>
        </div>

        <div class="composer">
          <input id="chatInput" type="text" placeholder="Explain your issue…" disabled />
          <button id="sendBtn" class="btn" disabled>Send</button>
        </div>
      </article>
    </section>
  </main>

  <script>
    const artisans = [
      { id: 1, name: "Ahmed Khan", service: "Plumber", rating: 4.9, price: 45, eta: "35 mins", tags: ["Leaks", "Pipes", "Bathroom"] },
      { id: 2, name: "Maya Brooks", service: "Electrician", rating: 4.8, price: 55, eta: "50 mins", tags: ["Wiring", "Switches", "Short Circuit"] },
      { id: 3, name: "Noah Singh", service: "Carpenter", rating: 4.7, price: 50, eta: "1 hour", tags: ["Doors", "Shelves", "Repairs"] },
      { id: 4, name: "Sofia Ali", service: "Painter", rating: 4.6, price: 40, eta: "2 hours", tags: ["Wall Patch", "Interior", "Touch-up"] },
      { id: 5, name: "Liam Patel", service: "AC Technician", rating: 4.9, price: 60, eta: "45 mins", tags: ["Cooling", "Maintenance", "Gas Refill"] }
    ];

    const chatReplies = {
      Plumber: "Thanks for the details. I can bring replacement parts and inspect the pipeline on arrival.",
      Electrician: "Got it. Please keep the area switched off. I'll diagnose and share a fixed quote after inspection.",
      Carpenter: "Understood. I can assess measurements on-site and suggest a durable repair option.",
      Painter: "Thanks! I can match your wall shade and finish the patch work in one visit.",
      "AC Technician": "Noted. I’ll run a cooling test and clean the filters first, then share what needs replacement."
    };

    const artisanList = document.getElementById("artisanList");
    const resultCount = document.getElementById("resultCount");
    const searchInput = document.getElementById("searchInput");
    const serviceFilter = document.getElementById("serviceFilter");
    const chatTitle = document.getElementById("chatTitle");
    const chatFeed = document.getElementById("chatFeed");
    const chatInput = document.getElementById("chatInput");
    const sendBtn = document.getElementById("sendBtn");
    const bookNowBtn = document.getElementById("bookNowBtn");
    const bookingInfo = document.getElementById("bookingInfo");
    const bookingDetails = document.getElementById("bookingDetails");

    let activeArtisan = null;

    function getFilteredArtisans() {
      const search = searchInput.value.trim().toLowerCase();
      const selectedService = serviceFilter.value;

      return artisans.filter((artisan) => {
        const serviceMatch = selectedService === "all" || artisan.service === selectedService;
        const searchMatch = !search ||
          artisan.name.toLowerCase().includes(search) ||
          artisan.service.toLowerCase().includes(search) ||
          artisan.tags.some(tag => tag.toLowerCase().includes(search));
        return serviceMatch && searchMatch;
      });
    }

    function renderArtisans() {
      const data = getFilteredArtisans();
      artisanList.innerHTML = "";
      resultCount.textContent = `${data.length} found`;

      if (!data.length) {
        artisanList.innerHTML = `<div class="artisan"><strong>No artisans matched your search.</strong><div class="meta">Try another skill, name, or issue keyword.</div></div>`;
        return;
      }

      data.forEach((artisan) => {
        const card = document.createElement("div");
        card.className = "artisan";
        card.innerHTML = `
          <h3>${artisan.name} · ${artisan.service}</h3>
          <div class="meta">⭐ ${artisan.rating} · From $${artisan.price} · ETA ${artisan.eta}</div>
          <div>${artisan.tags.map(tag => `<span class="pill">${tag}</span>`).join("")}</div>
          <div class="actions">
            <button class="btn secondary" data-chat="${artisan.id}">Chat</button>
            <button class="btn" data-book="${artisan.id}">Book</button>
          </div>
        `;
        artisanList.appendChild(card);
      });
    }

    function pushMessage(role, text) {
      const bubble = document.createElement("div");
      bubble.className = `msg ${role}`;
      bubble.textContent = text;
      chatFeed.appendChild(bubble);
      chatFeed.scrollTop = chatFeed.scrollHeight;
    }

    function openChat(artisanId) {
      const artisan = artisans.find(a => a.id === artisanId);
      if (!artisan) return;

      activeArtisan = artisan;
      chatTitle.textContent = `Chat with ${artisan.name} (${artisan.service})`;
      chatFeed.innerHTML = "";
      bookingInfo.hidden = true;
      pushMessage("artisan", `Hi, I'm ${artisan.name}. Tell me what issue you're facing.`);
      chatInput.disabled = false;
      sendBtn.disabled = false;
      bookNowBtn.disabled = false;
      chatInput.focus();
    }

    function sendClientMessage() {
      const text = chatInput.value.trim();
      if (!text || !activeArtisan) return;
      pushMessage("client", text);
      chatInput.value = "";

      setTimeout(() => {
        pushMessage("artisan", chatReplies[activeArtisan.service]);
      }, 450);
    }

    function bookService(id) {
      const artisan = artisans.find(a => a.id === id) || activeArtisan;
      if (!artisan) return;
      activeArtisan = artisan;
      openChat(artisan.id);

      const slot = new Date(Date.now() + 1000 * 60 * 90);
      bookingDetails.textContent = `${artisan.name} is booked for ${slot.toLocaleString()} at an estimated starting price of $${artisan.price}.`;
      bookingInfo.hidden = false;
      pushMessage("artisan", "Great, your slot is reserved. Please share your address and landmark in this chat.");
    }

    artisanList.addEventListener("click", (event) => {
      const chatButton = event.target.closest("button[data-chat]");
      const bookButton = event.target.closest("button[data-book]");
      if (chatButton) openChat(Number(chatButton.dataset.chat));
      if (bookButton) bookService(Number(bookButton.dataset.book));
    });

    sendBtn.addEventListener("click", sendClientMessage);
    chatInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") sendClientMessage();
    });

    bookNowBtn.addEventListener("click", () => {
      if (activeArtisan) bookService(activeArtisan.id);
    });

    searchInput.addEventListener("input", renderArtisans);
    serviceFilter.addEventListener("change", renderArtisans);

    renderArtisans();
  </script>
</body>
</html>
